scope:
  hosts:
    - 127.0.0.1:8787
  include_paths:
    - /api/
  exclude_paths:
    - /api/health
    - /api/login
    - /api/admin/login
  methods: [GET, POST, PUT, PATCH, DELETE]

sessions:
  - name: alice
    login:
      method: POST
      url: http://127.0.0.1:8787/api/login
      content_type: application/json
      body: '{"username":"alice","password":"hunter2"}'
      token_jsonpath: token
  - name: bob
    login:
      method: POST
      url: http://127.0.0.1:8787/api/login
      content_type: application/json
      body: '{"username":"bob","password":"swordfish"}'
      token_jsonpath: token

replay:
  concurrency: 4
  include_anon: true
  timeout_ms: 8000

detectors:
  bola: true
  jwt_abuse: true
  mass_assign: true
  id_mutation: true
  sqli: true
  cmd_injection: true
  ssti: true
  lfi: true
  ssrf: true
  xss: true
  default_creds: true
  jwt_probe_url: http://127.0.0.1:8787/api/me
  default_creds_urls:
    - http://127.0.0.1:8787/api/admin/login|user=username,password=password,json
